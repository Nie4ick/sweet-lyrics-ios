name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Metal toolchain (needed on Xcode 26+)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SpicyLyrics.xcodeproj \
            -scheme SpicyLyrics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpicyLyrics.app Payload/
          zip -qry SpicyLyrics-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SpicyLyrics-unsigned-ipa
          path: SpicyLyrics-unsigned.ipa
