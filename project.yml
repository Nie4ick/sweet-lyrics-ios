name: SpicyLyrics
options:
  bundleIdPrefix: com.spicylyrics.unofficial
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by CI: alpha / release / pr. Local builds are "dev".
    SPICY_CHANNEL: dev

targets:
  SpicyLyrics:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: SpicyLyrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spicylyrics.unofficial.ios
        PRODUCT_NAME: SpicyLyrics
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K684596528
    info:
      path: SpicyLyrics/Info.plist
      properties:
        CFBundleDisplayName: Spicy Lyrics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpicyLyricsChannel: $(SPICY_CHANNEL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.spicylyrics.unofficial.ios.auth
            CFBundleURLSchemes:
              - spicylyrics-ios
        LSApplicationQueriesSchemes:
          - spotify
        ITSAppUsesNonExemptEncryption: false
